user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml font/woff font/woff2;

    server {
        listen 80;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 =404 /404/index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' *.youtube.com plausible.koenvangilst.nl; script-src-elem 'self' blob: 'unsafe-inline' plausible.koenvangilst.nl; child-src 'self' blob: *.youtube.com; style-src 'self' 'unsafe-inline'; img-src * blob: data:; media-src i.imgur.com github.com *.s3.amazonaws.com *.koenvangilst.nl; connect-src *; font-src 'self'; frame-src 'self' svelte.dev codesandbox.io tetris-time.koenvangilst.nl voronoi-virus.koenvangilst.nl dancing-mosquitoes.koenvangilst.nl pong-wars.koenvangilst.nl purple-rain.koenvangilst.nl particle-life.koenvangilst.nl time-flies.koenvangilst.nl aarde.koenvangilst.nl rock-paper-scissors.koenvangilst.nl stacked-game-of-life.koenvangilst.nl" always;
        add_header Referrer-Policy "origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-DNS-Prefetch-Control "on" always;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location ^~ /fonts/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location ^~ /photos/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location ^~ /og/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location ^~ /static/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=604800" always;
        }

        location = /sitemap.xml {
            types { application/xml xml; }
            default_type application/xml;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=86400" always;
        }
        location = /feed.xml {
            types { application/rss+xml xml; }
            default_type application/rss+xml;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /blog/feed { return 301 /feed.xml; }
        location = /blog { return 301 /lab; }
        location = /blog/ { return 301 /lab; }
        location ~ ^/blog/(.+)$ { return 301 /lab/$1; }
        location = /portfolio { return 301 /lab; }
        location = /portfolio/ { return 301 /lab; }
        location ~ ^/portfolio/(.+)$ { return 301 /lab/$1; }
        location = /clients { return 301 /lab; }
        location = /clients/ { return 301 /lab; }
        location ~ ^/clients/(.+)$ { return 301 /lab/$1; }
        location = /labs { return 301 /lab; }
        location = /labs/ { return 301 /lab; }
        location ~ ^/labs/(.+)$ { return 301 /lab/$1; }
        location = /snippets { return 301 /lab; }
        location = /snippets/ { return 301 /lab; }
        location ~ ^/snippets/(.+)$ { return 301 /lab/$1; }
        location = /projects { return 301 /lab; }
        location = /projects/ { return 301 /lab; }
        location ~ ^/projects/(.+)$ { return 301 /lab/$1; }
        location ~ ^/photography/photo/ { return 302 /photography; }
        location = /llm-context { return 410; }
        location = /og { return 302 /og/fallback.png; }
        location = /404/index.html { internal; }

        location / {
            try_files $uri $uri/index.html =404;
        }
    }
}
