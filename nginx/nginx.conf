user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Caddy terminates public TLS and supplies sanitized forwarding headers.
    # Fall back to the direct connection values for local Docker usage.
    map $http_x_forwarded_for $forwarded_client_ip {
        ""      $remote_addr;
        default $http_x_forwarded_for;
    }

    map $http_x_forwarded_for $rate_limit_key {
        ""      $binary_remote_addr;
        default $http_x_forwarded_for;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    # Rate limiting: 30 requests/second per client IP for SSR endpoints
    limit_req_zone $rate_limit_key zone=ssr:10m rate=30r/s;

    # Cache public SSR pages in the container. The cache is intentionally not
    # mounted as a volume, so a new deployment starts with HTML for its own assets.
    proxy_cache_path /var/cache/nginx/ssr
        levels=1:2
        keys_zone=ssr_pages:10m
        max_size=256m
        inactive=365d
        use_temp_path=off;

    map $http_accept $ssr_cache_skip_accept {
        default 1;
        ~*text/html 0;
    }

    map $request_uri $ssr_cache_skip_uri {
        default 0;
        ~^/photography(?:/|$) 1;
        ~^/(?:feed|sitemap)\.xml(?:\?.*)?$ 1;
    }

    map $upstream_http_content_type $ssr_cache_skip_response {
        default 1;
        ~*^text/html 0;
    }

    upstream nodejs {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Emit relative Location headers in redirects so the browser resolves
        # them against its own origin. Without this, nginx constructs an absolute
        # URL from the Host header it receives (which may include :3000 when
        # running behind a reverse proxy), leaking the internal port.
        absolute_redirect off;

        # Default root: built client assets (JS/CSS bundles, fonts, public files)
        root /app/client;

        # Health check — answered directly by Nginx, no Node.js hit
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Immutable hashed JS/CSS bundles — safe to cache forever
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Font files (also hashed filenames → immutable)
        location ^~ /fonts/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Other static files (icons, favicons, etc.)
        location ^~ /static/ {
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Mirrored photography variants generated by zipline-sync. Filenames
        # include a content hash, so these are safe to cache indefinitely.
        location ^~ /photos/ {
            alias /data/photography/files/;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Content-addressed OG images generated after deployment. A new image
        # may briefly be absent while the one-shot worker is running.
        location ^~ /og/ {
            root /data;
            try_files $uri =404;
            error_page 404 = /_og-fallback.png;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Do not cache the fallback under a content-addressed URL: a later
        # request must be able to retrieve the generated image.
        location = /_og-fallback.png {
            internal;
            root /data;
            try_files /og/fallback.png =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Legacy URL redirects — handled before Node.js to avoid SSR errors
        location = /blog/feed      { return 301 /feed.xml; }
        location = /blog           { return 301 /lab; }
        location = /blog/          { return 301 /lab; }
        location ~ ^/blog/(.+)$    { return 301 /lab/$1; }

        location = /portfolio      { return 301 /lab; }
        location = /portfolio/     { return 301 /lab; }
        location ~ ^/portfolio/(.+)$ { return 301 /lab/$1; }

        location = /clients        { return 301 /lab; }
        location = /clients/       { return 301 /lab; }
        location ~ ^/clients/(.+)$ { return 301 /lab/$1; }

        location = /labs           { return 301 /lab; }
        location = /labs/          { return 301 /lab; }
        location ~ ^/labs/(.+)$    { return 301 /lab/$1; }

        location = /snippets       { return 301 /lab; }
        location = /snippets/      { return 301 /lab; }
        location ~ ^/snippets/(.+)$ { return 301 /lab/$1; }

        location = /projects       { return 301 /lab; }
        location = /projects/      { return 301 /lab; }
        location ~ ^/projects/(.+)$ { return 301 /lab/$1; }

        location ~ ^/photography/photo/ { return 302 /photography; }

        # Everything else: try static client files, fall back to SSR
        location / {
            try_files $uri @ssr;
        }

        # SSR / API — proxied to Node.js with full security headers
        location @ssr {
            limit_req zone=ssr burst=50 nodelay;
            limit_req_status 429;

            proxy_cache ssr_pages;
            proxy_cache_key "$scheme$host$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 365d;
            proxy_cache_lock on;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_bypass $ssr_cache_skip_uri $ssr_cache_skip_accept $http_cookie $http_authorization;
            proxy_no_cache $ssr_cache_skip_uri $ssr_cache_skip_accept $ssr_cache_skip_response $http_cookie $http_authorization $upstream_http_set_cookie;
            proxy_ignore_headers Cache-Control Expires;
            add_header X-SSR-Cache $upstream_cache_status always;

            # Prevent browsers from caching HTML documents. Without this, a browser
            # may serve a stale HTML page (referencing old hashed asset filenames)
            # after a redeploy, causing 404s for JS/CSS bundles that no longer exist.
            add_header Cache-Control "no-cache, must-revalidate" always;

            proxy_pass http://nodejs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $forwarded_client_ip;
            proxy_set_header X-Forwarded-For $forwarded_client_ip;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # Buffering is required for proxy_cache; Nginx still streams buffered
            # response chunks to the client while the upstream response is produced.
            proxy_buffering on;

            # Security headers applied to all SSR/API responses
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' *.youtube.com plausible.koenvangilst.nl; script-src-elem 'self' blob: 'unsafe-inline' plausible.koenvangilst.nl; child-src 'self' blob: *.youtube.com; style-src 'self' 'unsafe-inline'; img-src * blob: data:; media-src i.imgur.com github.com *.s3.amazonaws.com *.koenvangilst.nl; connect-src *; font-src 'self'; frame-src 'self' svelte.dev codesandbox.io tetris-time.koenvangilst.nl voronoi-virus.koenvangilst.nl dancing-mosquitoes.koenvangilst.nl pong-wars.koenvangilst.nl purple-rain.koenvangilst.nl particle-life.koenvangilst.nl time-flies.koenvangilst.nl aarde.koenvangilst.nl rock-paper-scissors.koenvangilst.nl stacked-game-of-life.koenvangilst.nl" always;
            add_header Referrer-Policy "origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-DNS-Prefetch-Control "on" always;
        }
    }
}
